<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODS'ZONE</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Fira Code', monospace;
      background-color: #0d1117;
      color: #c9d1d9;
    }

    .welcome {
      background-color: #00ff99;
      padding: 20px 0;
      color: black;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0, 255, 153, 0.3);
    }

    .welcome h1 {
      font-size: 40px;
      margin: 0;
    }

    .welcome p {
      font-size: 20px;
      margin-top: 8px;
    }

    .navbar {
      background-color: #161b22;
      padding: 15px 0;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0, 255, 153, 0.1);
    }

    .navbar a {
      color: #00ff99;
      margin: 0 20px;
      text-decoration: none;
      font-size: 20px;
      transition: color 0.3s ease;
    }

    .navbar a:hover {
      color: white;
    }

    /* LOGIN SECTION */
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .login-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.15);
      text-align: center;
    }

    .login-box h2 {
      color: #00ff99;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: white;
      font-family: 'Fira Code', monospace;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00ff99;
      box-shadow: 0 0 5px rgba(0, 255, 153, 0.5);
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #00ff99;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-box button:hover {
      background-color: #00e68a;
    }

    .login-note {
      margin-top: 15px;
      font-size: 14px;
      color: #c9d1d9;
    }

    /* Simple gray hover for Create Account */
    .create-account-link {
      color: #00ff99;
      font-size: 14px;
      text-decoration: none;
      padding: 2px 4px;
      border-radius: 3px;
      transition: background-color 0.2s ease;
    }

    .create-account-link:hover {
      background-color: #30363d;
    }

/* 📱 MOBILE RESPONSIVE */
@media (max-width: 768px) {

  .welcome h1 {
    font-size: 28px;
  }

  .welcome p {
    font-size: 16px;
  }

  .navbar a {
    display: inline-block;
    margin: 8px;
    font-size: 16px;
  }

  .login-wrapper {
    padding: 30px 10px;
  }

  .login-box {
    max-width: 100%;
    padding: 20px;
  }
}


  </style>
</head>

<body>

  <div class="welcome">
    <h1>WELCOME TO MODS'ZONE</h1>
    <p>Download Free Modded APKs of Popular Games and Apps</p>
  </div>

  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="pcgames.html">PC Games</a>
    <a href="contact.html">Contact</a>
  </div>

  <!-- LOGIN -->
  <div class="login-wrapper">
    <div class="login-box" id="loginBox">

      <h2>LOGIN</h2>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit">Login</button>
      </form>

      <p style="margin-top:12px;">
        Don’t have an account?
        <a href="signup.html" class="create-account-link">Create Account</a>
      </p>

      <p class="login-note">
        Login to access exclusive MOD content
      </p>

    </div>
  </div>

  <!-- LOGIN SCRIPT -->
  <script src="login.js"></script>

</body>
</html>
