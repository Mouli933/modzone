<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Games MODs - MODS'ZONE</title>

  <!-- Developer font -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Fira Code', monospace;
      background-color: #0d1117;
      color: #c9d1d9;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00ff99;
      font-size: 36px;
      margin-bottom: 40px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .card {
      background: linear-gradient(145deg, #161b22, #0d1117);
      border: 1px solid #30363d;
      border-radius: 10px;
      width: 300px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.4);
    }

.card img {
  width: 100%;
  height: 350px;              /* fixed frame height */
   object-position: center;    /* center the image */
  background-color: #0d0d0d;
  object-fit: full;
  /* fill empty space nicely */
}


.card-link {
  text-decoration: none;
  color: inherit;
}

    .card-content {
      padding: 20px;
    }

    .card-content h2 {
      color: #00ff99;
      margin-bottom: 15px;
      font-size: 22px;
    }

  .card-content ul {
  list-style: none;
  padding-left: 0;
  margin: 0;
}


    .card-content li {
      margin-bottom: 8px;
      line-height: 1.6;
      padding: 6px 10px;
      border-radius: 4px;
      transition: background-color 0.3s, color 0.3s;
      cursor: pointer;
    }

    .card-content li:hover {
      background-color: #00ff99;
      color: #000;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: #00ff99;
      text-decoration: none;
      font-size: 18px;
    }

    .back-link:hover {
      color: #ffffff;
    }

/* 📱 MOBILE RESPONSIVE */
@media (max-width: 768px) {

  h1 {
    font-size: 28px;
  }

  .container {
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 92%;
  }

  .card img {
    height: 220px;
  }
}




  </style>
</head>
