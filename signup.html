<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | MODS'ZONE</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Fira Code', monospace;
      background-color: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .welcome {
      background-color: #00ff99;
      padding: 20px 0;
      color: black;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0, 255, 153, 0.3);
    }

    .welcome h1 {
      margin: 0;
      font-size: 36px;
    }

    .welcome p {
      margin-top: 6px;
      font-size: 18px;
    }

    /* Signup box */
    .signup-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .signup-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.15);
      text-align: center;
    }

    .signup-box h2 {
      color: #00ff99;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: white;
      font-family: 'Fira Code', monospace;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00ff99;
      box-shadow: 0 0 5px rgba(0, 255, 153, 0.5);
    }

    .signup-box button {
      width: 100%;
      padding: 12px;
      background-color: #00ff99;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .signup-box button:hover {
      background-color: #00e68a;
    }

    .extra-links {
      margin-top: 18px;
      font-size: 14px;
    }

    .extra-links a {
      color: #00ff99;
      text-decoration: none;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="welcome">
    <h1>MODS'ZONE</h1>
    <p>Create your account to unlock MODs</p>
  </div>

  <!-- Signup Box -->
  <div class="signup-wrapper">
    <div class="signup-box">
      <h2>CREATE ACCOUNT</h2>

      <!-- ✅ FORM ID ADDED -->
      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Your Name" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signupConfirmPassword" placeholder="••••••••" required>
        </div>

        <button type="submit">Create Account</button>
      </form>

      <div class="extra-links">
        <p>Already have an account? <a href="index.html">Login</a></p>
        <p><a href="index.html">← Back to Home</a></p>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="signup.js"></script>

</body>
</html>
